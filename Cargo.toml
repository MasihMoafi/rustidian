[package]
name = "rustidian"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Rustidian — a native Markdown notebook for local vaults"
repository = "https://github.com/MasihMoafi/rustidian"
readme = "README.md"
keywords = ["markdown", "notes", "obsidian", "egui"]
categories = ["text-editors"]
license = "MIT"

[features]
default = ["desktop"]
desktop = []

[[bin]]
name = "rustidian"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links"] }
epaint = { version = "0.37", default-features = false, features = ["color_fonts"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "file", "image", "gif", "webp", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
walkdir = "2.5"
pulldown-cmark = { version = "0.13.4", default-features = false }
notify = "8.2"
nucleo-matcher = "0.3"
rustix = { version = "1.1", features = ["fs"] }
trash = "5.2"
percent-encoding = "2.3"
serde_yaml_ng = "0.10"
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
regex = "1.12"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
usvg = { version = "=0.45.1", default-features = false, features = ["text"] }
redb = "=4.4.0"
imara-diff = { version = "=0.2.0", default-features = false }
fastrand = "=2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[patch.crates-io]
epaint = { path = "vendor/epaint" }
egui = { path = "vendor/egui" }
