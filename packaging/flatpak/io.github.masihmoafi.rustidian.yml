id: io.github.masihmoafi.rustidian
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rustidian
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Vaults are ordinary folders the user picks anywhere in home; Rustidian watches, renames and links whole folders,
  # which portal file access cannot provide.
  - --filesystem=home
  # Notes can embed images from the web.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: rustidian
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/rustidian/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/rustidian /app/bin/rustidian
      - install -Dm644 packaging/flatpak/io.github.masihmoafi.rustidian.metainfo.xml /app/share/metainfo/io.github.masihmoafi.rustidian.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.masihmoafi.rustidian.desktop /app/share/applications/io.github.masihmoafi.rustidian.desktop
      - install -Dm644 docs/brand/store-icon.png /app/share/icons/hicolor/512x512/apps/io.github.masihmoafi.rustidian.png
    sources:
      # CI builds this checkout; the Flathub copy uses a git source pinned to a release commit (see SUBMIT.txt).
      - type: dir
        path: ../..
      - cargo-sources.json
