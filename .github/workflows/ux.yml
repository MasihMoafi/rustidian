name: Rustidian UX candidate

on:
  push:
    branches: ['work/rustidian-ux-*']
  workflow_dispatch:
    inputs:
      publish_run:
        description: 'Publish an already verified UX run; skip all builds in this dispatch'
        type: string
        default: ''
      gui_only:
        description: 'Run optimized GUI checks only; do not package or upload artifacts'
        type: boolean
        default: false
      modal_baseline:
        description: 'Prove the queued Escape regression fails on the previous runtime before building the repair'
        type: boolean
        default: false
      package_after_checks:
        description: 'Create and retain the Debian package only after selected GUI and package checks pass'
        type: boolean
        default: false
      keep_binary:
        description: 'With gui_only: build the exact release profile and keep the binary for a local install'
        type: boolean
        default: false
      reuse_run:
        description: 'Reuse an optimized candidate after harness-only changes; retain passed native evidence'
        type: string
        default: ''
      sections:
        description: 'Space-separated native GUI sections'
        type: string
        default: 'palette-queued table-resize table-edges table-edit undo graph graph-state visual-controls note-dialogs workspaces recovery page-preview font-controls palettes file-move vaults scrolling properties'

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    if: ${{ inputs.publish_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: '1.95.0'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native test tools
        run: |
          sudo apt-get -o Acquire::http::Proxy=DIRECT -o Acquire::https::Proxy=DIRECT update -qq
          sudo apt-get -o Acquire::http::Proxy=DIRECT -o Acquire::https::Proxy=DIRECT install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dri xvfb xdotool xclip x11-utils x11-xserver-utils openbox zenity python3-pil python3-xlib desktop-file-utils xdg-utils
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          mkdir -p reports
          for tool in Xvfb xdotool xclip xset xprop xwininfo; do command -v "$tool"; done
      - name: Install file manager for native Reveal verification
        if: ${{ contains(inputs.sections, 'reveal') }}
        run: sudo apt-get -o Acquire::http::Proxy=DIRECT -o Acquire::https::Proxy=DIRECT install -y --no-install-recommends nautilus dbus-x11
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gui-only-${{ inputs.gui_only }}-keep-binary-${{ inputs.keep_binary }}
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Restore unchanged optimized candidate and native evidence
        if: ${{ inputs.reuse_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
          GUI_ONLY: ${{ inputs.gui_only }}
        run: |
          test "$GUI_ONLY" = true
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
          gh run view "$REUSE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,status,conclusion,url > "$RUNNER_TEMP/reused-run.json"
          source_commit=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["status"]=="completed"; print(d["headSha"])' "$RUNNER_TEMP/reused-run.json")
          python3 scripts/reuse-actions-candidate.py --source-commit "$source_commit" --check-source
          gh run download "$REUSE_RUN" --repo "$GITHUB_REPOSITORY" --name "rustidian-candidate-$source_commit" --dir "$RUNNER_TEMP/reused-candidate"
          python3 scripts/reuse-actions-candidate.py --source-commit "$source_commit" --artifact-dir "$RUNNER_TEMP/reused-candidate" --run-metadata "$RUNNER_TEMP/reused-run.json"
      - name: Verify and obtain dependency notices
        if: ${{ !inputs.gui_only || inputs.package_after_checks }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern THIRD_PARTY_NOTICES.txt --dir reports/baseline-notices/ --skip-existing
          python3 scripts/language-notices.py --baseline-notices reports/baseline-notices/THIRD_PARTY_NOTICES.txt --output reports/THIRD_PARTY_NOTICES.txt | tee reports/notices-generation.json
      - name: Rust behavior checks
        if: ${{ !inputs.gui_only }}
        run: cargo test --locked --all-targets --no-fail-fast 2>&1 | tee reports/rust-tests.log
      - name: Clippy
        if: ${{ !inputs.gui_only }}
        run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Native functional checks before optimization
        if: ${{ !inputs.gui_only }}
        run: |
          tar -czf reports/rustidian-functional.tar.gz -C target/debug rustidian
          gui_status=0
          for section in tab-drag table-resize trash-options palettes code undo; do
            if ! python3 tests/gui_smoke.py --binary target/debug/rustidian --section "$section" > "reports/debug-$section.log" 2>&1; then
              gui_status=1
              tail -n 80 "reports/debug-$section.log"
              if test -f "reports/gui-$section-failure-app.log"; then tail -n 80 "reports/gui-$section-failure-app.log"; fi
            fi
          done
          python3 tests/gui_smoke.py --binary target/debug/rustidian --open-file rs > reports/debug-open-rs.log 2>&1 || gui_status=1
          exit "$gui_status"
      - name: Prove queued modal regression on the previous runtime
        if: ${{ inputs.gui_only && inputs.modal_baseline }}
        run: |
          cp src/app.rs "$RUNNER_TEMP/rustidian-fixed-app.rs"
          trap 'cp "$RUNNER_TEMP/rustidian-fixed-app.rs" src/app.rs' EXIT
          git show 90502b2a87ebb3d1b555907412e6068c391a91eb:src/app.rs > src/app.rs
          CARGO_PROFILE_RELEASE_LTO=false cargo rustc --locked --release --bin rustidian -- -C opt-level=2
          if python3 tests/gui_smoke.py --binary target/release/rustidian --section palette-queued > reports/modal-order-baseline.log 2>&1; then
            echo 'The modal regression unexpectedly passed on the previous runtime'
            exit 1
          fi
          python3 - <<'BASELINE'
          from pathlib import Path
          assert 'Earlier Escape closed the newly opened command palette or quick-open' in Path('reports/modal-order-baseline.log').read_text(), 'Baseline failed for an unrelated reason'
          print('Confirmed: the queued Escape regression fails on the previous runtime')
          BASELINE
          cp "$RUNNER_TEMP/rustidian-fixed-app.rs" src/app.rs
          git diff --exit-code -- src/app.rs
      - name: Build optimized Rustidian
        env:
          GUI_ONLY: ${{ inputs.gui_only }}
          KEEP_BINARY: ${{ inputs.keep_binary }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          if test -n "$REUSE_RUN"; then
            test -x target/release/rustidian
            echo "Using the exact source-checked optimized candidate"
          elif test "$GUI_ONLY" = true && test "$KEEP_BINARY" != true; then
            CARGO_PROFILE_RELEASE_LTO=false cargo rustc --locked --release --bin rustidian -- -C opt-level=2 2>&1 | tee reports/build.log
          else
            cargo build --locked --release --bin rustidian 2>&1 | tee reports/build.log
          fi
          git rev-parse HEAD > reports/source-commit.txt
          sha256sum target/release/rustidian > reports/binary.sha256
          target/release/rustidian --version | tee reports/version.txt
      - name: Real package and installation checks
        if: ${{ !inputs.gui_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package-linux.py --binary target/release/rustidian --notices reports/THIRD_PARTY_NOTICES.txt --output reports/rustidian-linux-x86_64.tar.gz
          python3 scripts/package-deb.py --binary target/release/rustidian --notices reports/THIRD_PARTY_NOTICES.txt --output reports/rustidian-linux-amd64.deb
          python3 tests/linux_bundle.py --binary target/release/rustidian 2>&1 | tee reports/package-tests.log
          python3 tests/debian_package.py --binary target/release/rustidian --package reports/rustidian-linux-amd64.deb --notices reports/THIRD_PARTY_NOTICES.txt --system 2>&1 | tee reports/debian-tests.log
      - name: Exact optimized app workflows
        if: ${{ !inputs.gui_only }}
        run: |
          gui_status=0
          for section in graph-animation sidebar-boundary tab-drag table-resize table-edges trash-options palettes tab-actions tab-overflow table-edit essential undo settings folders code reading-code visual-controls; do
            if ! python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section "$section" > "reports/gui-$section.log" 2>&1; then
              gui_status=1
              tail -n 80 "reports/gui-$section.log"
              if test -f "reports/gui-$section-failure-app.log"; then tail -n 80 "reports/gui-$section-failure-app.log"; fi
            fi
          done
          python3 tests/gui_smoke.py --binary target/release/rustidian --open-file md > reports/gui-open-md.log 2>&1 || gui_status=1
          python3 tests/gui_smoke.py --binary target/release/rustidian --open-file txt > reports/gui-open-txt.log 2>&1 || gui_status=1
          for extension in rs html toml; do
            python3 tests/gui_smoke.py --binary target/release/rustidian --open-file "$extension" > "reports/gui-open-$extension.log" 2>&1 || gui_status=1
          done
          exit "$gui_status"
      - name: Selected native GUI workflows
        if: ${{ inputs.gui_only }}
        env:
          GUI_SECTIONS: ${{ inputs.sections }}
        run: |
          # watch-limit gives the app a private inotify limit in a user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          read -ra sections <<< "$GUI_SECTIONS"
          test "${#sections[@]}" -gt 0
          gui_status=0
          for section in "${sections[@]}"; do
            [[ "$section" =~ ^[a-z]+(-[a-z]+)*$ ]] || exit 2
            if python3 tests/gui_smoke.py --binary target/release/rustidian --section "$section" > "reports/selected-$section.log" 2>&1; then
              echo "PASSED: $section"
              python3 -m json.tool reports/gui-results.json
            else
              gui_status=1
              echo "FAILED: $section"
              tail -n 80 "reports/selected-$section.log"
              if test -f "reports/gui-$section-failure-app.log"; then tail -n 80 "reports/gui-$section-failure-app.log"; fi
              if test -f reports/gui-results.json; then python3 -m json.tool reports/gui-results.json; fi
            fi
          done
          exit "$gui_status"
      - name: Retain candidate binary
        if: ${{ always() && inputs.gui_only && inputs.keep_binary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustidian-candidate-${{ github.sha }}
          path: |
            target/release/rustidian
            reports/
          retention-days: 1
      - name: Check core behavior for the package candidate
        if: ${{ inputs.gui_only && inputs.package_after_checks }}
        run: CARGO_PROFILE_RELEASE_LTO=false cargo test --locked --release --no-default-features --lib --tests --no-fail-fast 2>&1 | tee reports/package-core-tests.log
      - name: Create and verify the Debian package
        if: ${{ inputs.gui_only && inputs.package_after_checks }}
        env:
          GH_TOKEN: ${{ github.token }}
          GUI_SECTIONS: ${{ inputs.sections }}
        run: |
          python3 scripts/package-deb.py --binary target/release/rustidian --notices reports/THIRD_PARTY_NOTICES.txt --output reports/rustidian-linux-amd64.deb
          python3 tests/debian_package.py --binary target/release/rustidian --package reports/rustidian-linux-amd64.deb --notices reports/THIRD_PARTY_NOTICES.txt --system | tee reports/debian-verification.json
          python3 scripts/package-linux.py --binary target/release/rustidian --notices reports/THIRD_PARTY_NOTICES.txt --output reports/rustidian-linux-x86_64.tar.gz
          python3 tests/linux_bundle.py --binary target/release/rustidian --archive reports/rustidian-linux-x86_64.tar.gz | tee reports/portable-verification.log
          python3 - <<'INFO'
          import hashlib,json,os,subprocess
          from pathlib import Path
          binary=Path('target/release/rustidian')
          checks={name:json.loads(Path('reports/gui-'+name+'-results.json').read_text()) for name in os.environ['GUI_SECTIONS'].split()}
          assert checks and all(value['status']=='passed' for value in checks.values())
          if Path('reports/reused-run.json').exists():
              for path in Path('reports').glob('gui-*-results.json'):
                  section=path.name.removeprefix('gui-').removesuffix('-results.json')
                  result=json.loads(path.read_text())
                  if section not in checks and result.get('status')=='passed' and len(result.get('checks',[]))>1:
                      checks[section]=result
          digest=hashlib.sha256(binary.read_bytes()).hexdigest()
          package=json.loads(Path('reports/debian-verification.json').read_text())
          assert package['status']=='passed' and package['exact_binary_sha256']==digest
          assert package['package_sha256']==hashlib.sha256(Path('reports/rustidian-linux-amd64.deb').read_bytes()).hexdigest()
          info={'source_commit':os.environ['GITHUB_SHA'],'binary_sha256':digest,'version':subprocess.check_output([str(binary.resolve()),'--version'],text=True).strip(),'depends':subprocess.check_output(['dpkg-deb','--field','reports/rustidian-linux-amd64.deb','Depends'],text=True).strip(),'gui_checks':checks,'debian_verification':package,'dependency_notices':json.loads(Path('reports/notices-generation.json').read_text()),'scope':'Optimized Linux amd64 executable; native X11 workflows on Ubuntu 24.04; native Wayland interaction unverified','run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          info['binary_source_commit']=Path('reports/binary-source-commit.txt').read_text().strip() if Path('reports/binary-source-commit.txt').exists() else os.environ['GITHUB_SHA']
          info['reused_native_run']=json.loads(Path('reports/reused-run.json').read_text()) if Path('reports/reused-run.json').exists() else None
          Path('reports/BUILDINFO.json').write_text(json.dumps(info,indent=2)+'\n')
          INFO
          (cd reports && sha256sum rustidian-linux-amd64.deb rustidian-linux-x86_64.tar.gz BUILDINFO.json > SHA256SUMS)
      - name: Retain requested package and selected evidence
        if: ${{ always() && inputs.gui_only && inputs.package_after_checks }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustidian-verified-${{ github.sha }}
          path: |
            reports/rustidian-linux-amd64.deb
            reports/rustidian-linux-x86_64.tar.gz
            reports/rustidian-linux-x86_64.tar.gz.sha256
            reports/THIRD_PARTY_NOTICES.txt
            reports/notices-generation.json
            reports/portable-verification.log
            reports/BUILDINFO.json
            reports/SHA256SUMS
            reports/debian-verification.json
            reports/package-core-tests.log
            reports/selected-*.log
            reports/modal-order-baseline.log
            reports/gui-*-results.json
            reports/gui-failure.png
            reports/native-table-edge-*.png
            reports/native-table-edge-*.json
            reports/native-graph-state-*.png
            reports/native-graph-state-*.json
            reports/native-form-add-property.png
            reports/native-graph-global-dark.png
            reports/native-graph-proportions-*.png
            reports/graph-proportions-*.json
            reports/native-slider-*.png
            reports/slider-*.json
            reports/native-scrollbar-*.png
            reports/scrollbar-*-states.json
            reports/visual-controls-results.json
            reports/native-syntax-*.png
            reports/native-syntax-*-controls.json
            reports/native-reading-code-*.png
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Retain exact candidate and evidence
        if: ${{ always() && !inputs.gui_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustidian-ux-${{ github.sha }}
          path: reports/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: ${{ inputs.publish_run }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Follow the requested verification run
        run: gh run watch "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --interval 60 --exit-status
      - name: Install package-check tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xdotool xclip x11-utils x11-xserver-utils python3-pil python3-xlib desktop-file-utils xdg-utils libgl1-mesa-dri fontconfig fonts-dejavu-core fonts-liberation
      - name: Publish the verified installers directly from GitHub
        run: python3 scripts/publish-checked-release.py --run "$VERIFIED_RUN"
