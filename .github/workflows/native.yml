name: Rust checks

on:
  push:
    branches: [main, 'work/rustidian-release-*']
    paths-ignore: ['docs/**', 'README.md', 'ES.md', 'VISION.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'ES.md', 'VISION.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Check core and integration targets
        run: cargo +1.95.0 clippy --locked --no-default-features --lib --tests -- -D warnings
      - name: Run core and integration tests
        run: cargo +1.95.0 test --locked --no-default-features --lib --tests --no-fail-fast
      - name: Run desktop binary unit tests
        run: cargo +1.95.0 test --locked --bin rustidian --no-fail-fast
