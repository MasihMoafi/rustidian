name: Native Rust

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'ES.md', 'VISION.md', 'assets/icons/README.md', 'tests/gui_smoke.py', 'scripts/obsidian-reference.py', 'scripts/reuse-actions-candidate.py', 'scripts/compare-editors.py', 'scripts/record-keyboard.py', 'scripts/native_input.py', '.github/workflows/native.yml']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'ES.md', 'VISION.md', 'assets/icons/README.md', 'tests/gui_smoke.py', 'scripts/obsidian-reference.py', 'scripts/reuse-actions-candidate.py', 'scripts/compare-editors.py', 'scripts/record-keyboard.py', 'scripts/native_input.py', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Optional previous Actions run containing the optimized candidate'
        type: string
        default: ''
      reuse_commit:
        description: 'Full SHA of that run; runtime source files must be unchanged'
        type: string
        default: ''
      diagnostic_only:
        description: 'Trace comparison keyboard input only; never package this as a verified release'
        type: boolean
        default: false
      verification_scope:
        description: 'All workflows, or a bounded graph-only update to an already verified app'
        type: choice
        options: [all, graph]
        default: all
      baseline_commit:
        description: 'Verified installed source SHA; required for graph-only verification'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.95.0'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check runner storage
        run: |
          mkdir -p reports
          df -h .
          /usr/bin/python3 - <<'PY'
          import shutil
          if shutil.disk_usage('.').free < 8 * 1024**3:
              raise SystemExit('At least 8 GiB of free runner storage is required.')
          PY
      - name: Validate bounded graph update
        if: ${{ inputs.verification_scope == 'graph' }}
        env:
          VERIFIED_BASELINE: ${{ inputs.baseline_commit }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          baseline = os.environ['VERIFIED_BASELINE']
          assert re.fullmatch('[0-9a-f]{40}', baseline)
          subprocess.run(['git', 'merge-base', '--is-ancestor', baseline, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines()
          allowed = {'src/graph_ui.rs', 'tests/gui_smoke.py', '.github/workflows/native.yml', 'ES.md', 'VISION.md', 'README.md'}
          assert all(path in allowed or path.startswith('docs/') for path in changed), changed
          runtime = [path for path in changed if path.startswith('src/')]
          assert runtime == ['src/graph_ui.rs'], runtime
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          pathlib.Path('reports/verification-scope.json').write_text(json.dumps({'scope':'graph', 'source':source, 'verified_baseline':baseline, 'runtime_paths':runtime, 'changed_paths':changed}, indent=2)+'\n')
          PY
      - name: Install native GUI test dependencies
        timeout-minutes: 8
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          rustidian_apt_options=(-o Acquire::http::Proxy=DIRECT -o Acquire::https::Proxy=DIRECT -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1)
          sudo apt-get "${rustidian_apt_options[@]}" update -qq
          sudo apt-get "${rustidian_apt_options[@]}" install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dri xvfb xdotool xclip x11-utils openbox zenity python3-pil python3-xlib desktop-file-utils xdg-utils
      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        if: ${{ inputs.reuse_run_id == '' }}
        run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Rust behavior checks
        if: ${{ inputs.reuse_run_id == '' }}
        run: cargo test --locked --all-targets --no-fail-fast 2>&1 | tee reports/rust-tests.log
      - name: Preserve an existing debug app for early disposable checks
        if: ${{ inputs.reuse_run_id == '' }}
        run: |
          if [ -x target/debug/rustidian ]; then
            mkdir -p "$RUNNER_TEMP/rustidian-functional"
            tar -czf "$RUNNER_TEMP/rustidian-functional/rustidian-functional.tar.gz" -C target/debug rustidian -C "$GITHUB_WORKSPACE" demo-vault LICENSE assets/fonts/LICENSE-*.txt
            sha256sum target/debug/rustidian > "$RUNNER_TEMP/rustidian-functional/functional.sha256"
            git rev-parse HEAD > "$RUNNER_TEMP/rustidian-functional/binary-source-commit.txt"
          fi
      - name: Keep the existing debug app for one day
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-native-${{ github.sha }}
          retention-days: 1
          path: ${{ runner.temp }}/rustidian-functional/
          if-no-files-found: ignore
      - name: Check new workflows before optimized compilation
        if: ${{ inputs.reuse_run_id == '' }}
        run: |
          test -x target/debug/rustidian
          early_status=0
          trap 'early_status=1' ERR
          set +e
          /usr/bin/python3 tests/gui_smoke.py --binary target/debug/rustidian --section hover 2>&1 | tee reports/early-hover-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/debug/rustidian --section system-open 2>&1 | tee reports/early-system-open-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/debug/rustidian --section graph 2>&1 | tee reports/early-graph-gui.log
          exit "$early_status"
      - name: Preserve early native diagnostics
        if: ${{ always() && !cancelled() && inputs.reuse_run_id == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: early-native-${{ github.sha }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            reports/early-hover-gui.log
            reports/early-system-open-gui.log
            reports/early-graph-gui.log
            reports/verification-scope.json
            reports/graph-label-stability.json
            reports/native-selected-*.png
            reports/native-hover-*.png
            reports/hover-samples.json
            reports/hover-latency.json
            reports/native-system-open-*
            reports/native-graph-*
            reports/gui-*.json
            reports/gui-*-failure*
            reports/gui-failure.png
            reports/missing-control*
      - name: Build the optimized GUI candidate
        id: build_candidate
        if: ${{ inputs.reuse_run_id == '' }}
        run: |
          cargo build --locked --release --bin rustidian --example editor_benchmark 2>&1 | tee reports/candidate-build.log
          sha256sum target/release/rustidian > reports/candidate.sha256
          git rev-parse HEAD > reports/binary-source-commit.txt
          python3 scripts/package-linux.py --binary target/release/rustidian --output reports/rustidian-candidate-linux-x86_64.tar.gz
      - name: Restore an unchanged optimized candidate
        id: restore_candidate
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          REUSE_COMMIT: ${{ inputs.reuse_commit }}
        run: |
          command -v gh
          python3 scripts/reuse-actions-candidate.py --source-commit "$REUSE_COMMIT" --check-source
          timeout 25s gh run view "$REUSE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha > "$RUNNER_TEMP/source-run.json"
          timeout 180s gh run download "$REUSE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "rustidian-linux-$REUSE_COMMIT" --dir "$RUNNER_TEMP/candidate-source"
          python3 scripts/reuse-actions-candidate.py --source-commit "$REUSE_COMMIT" --artifact-dir "$RUNNER_TEMP/candidate-source" --run-metadata "$RUNNER_TEMP/source-run.json"
      - name: Make the optimized app available before the long GUI checks
        if: ${{ !inputs.diagnostic_only && inputs.reuse_run_id == '' && steps.build_candidate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-native-${{ github.sha }}
          retention-days: 1
          path: |
            reports/rustidian-candidate-linux-x86_64.tar.gz
            reports/candidate.sha256
            reports/binary-source-commit.txt
            reports/candidate-build.log
      - name: Focused link, window, diagram, checklist, table and vault regressions
        if: ${{ !inputs.diagnostic_only }}
        run: |
          gui_status=0
          trap 'gui_status=1' ERR
          set +e
          if [ '${{ inputs.verification_scope }}' = 'graph' ]; then
            /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section graph 2>&1 | tee reports/graph-gui.log
            exit "$gui_status"
          fi
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section palette-queued 2>&1 | tee reports/palette-queued-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section unicode-queued 2>&1 | tee reports/unicode-queued-gui.log
          RUSTIDIAN_TRACE_COMMANDS=1 /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section attachments 2>&1 | tee reports/attachments-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section navigation 2>&1 | tee reports/navigation-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section chrome 2>&1 | tee reports/chrome-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section diagrams 2>&1 | tee reports/diagrams-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section tasks 2>&1 | tee reports/task-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section table-edit 2>&1 | tee reports/table-edit-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section system-open 2>&1 | tee reports/system-open-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section graph 2>&1 | tee reports/graph-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section emoji 2>&1 | tee reports/emoji-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section vaults 2>&1 | tee reports/vaults-gui.log
          RUSTIDIAN_TRACE_COMMANDS=1 /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section note-aids 2>&1 | tee reports/note-aids-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section note-creators 2>&1 | tee reports/note-creators-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section tab-actions 2>&1 | tee reports/tab-actions-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section tab-restore 2>&1 | tee reports/tab-restore-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section font-controls 2>&1 | tee reports/font-controls-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section file-copy 2>&1 | tee reports/file-copy-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section file-move 2>&1 | tee reports/file-move-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section native-highlights 2>&1 | tee reports/native-highlights-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section page-preview 2>&1 | tee reports/page-preview-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section quick-ranking 2>&1 | tee reports/quick-ranking-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section inline-styles 2>&1 | tee reports/inline-styles-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section colors 2>&1 | tee reports/colors-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section workspaces 2>&1 | tee reports/workspaces-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section recovery 2>&1 | tee reports/recovery-gui.log
          exit "$gui_status"
      - name: Keep the focused candidate and native evidence available
        if: ${{ !inputs.diagnostic_only && !cancelled() && (steps.build_candidate.outcome == 'success' || steps.restore_candidate.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-native-${{ github.sha }}
          retention-days: 1
          path: |
            reports/binary-source-commit.txt
            reports/candidate.sha256
            reports/*-gui.log
            reports/gui-*-results.json
            reports/gui-*-failure*
            reports/hover-samples.json
            reports/hover-latency.json
            reports/task-clipping.json
            reports/native-navigation.png
            reports/native-tasks.png
            reports/native-task-clipping.png
            reports/native-edit-table-*.png
            reports/native-vault*.png
            reports/native-vault-picker-entry.json
            reports/native-system-open-*
            reports/native-graph-*
            reports/native-emoji-*
            reports/system-open-gui.log
            reports/graph-gui.log
            reports/verification-scope.json
            reports/graph-label-stability.json
            reports/emoji-gui.log
            reports/native-note-aids-*.png
            reports/native-template-*.png
            reports/native-daily-*.png
            reports/native-workspaces-*.png
            reports/native-recovery-*.png
            reports/native-unique-*.png
            reports/native-random-*.png
            reports/native-pinned-tabs.png
            reports/native-tab-menu-*.png
            reports/native-file-copy*.png
            reports/native-file-move*.png
            reports/native-image-tab-*.png
            reports/native-page-preview-*.png
            reports/native-quick-ranking-*.png
            reports/native-inline-*.png
            reports/native-color-*.png
            reports/native-core-highlight-*.png
            reports/native-highlight-*.png
            reports/native-palette-queued.png
            reports/native-unicode-keyboard.png
            reports/unicode-keyboard-calibration.json
            reports/command-sequence.jsonl
      - name: Native GUI and portable bundle checks
        if: ${{ !inputs.diagnostic_only && inputs.verification_scope != 'graph' && !cancelled() && (steps.build_candidate.outcome == 'success' || steps.restore_candidate.outcome == 'success') }}
        run: |
          gui_status=0
          trap 'gui_status=1' ERR
          set +e
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault --section chrome 2>&1 | tee reports/chrome-release-gui.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --open-file md 2>&1 | tee reports/file-open-markdown-release.log
          /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --open-file txt 2>&1 | tee reports/file-open-text-release.log
          RUSTIDIAN_TRACE_COMMANDS=1 /usr/bin/python3 tests/gui_smoke.py --binary target/release/rustidian --default-vault 2>&1 | tee reports/native-gui.log
          exit "$gui_status"
      - name: Serial editor CPU measurements
        if: ${{ !inputs.diagnostic_only && !cancelled() && (steps.build_candidate.outcome == 'success' || steps.restore_candidate.outcome == 'success') }}
        run: |
          if [ ! -x target/release/examples/editor_benchmark ]; then
            cargo build --locked --release --example editor_benchmark 2>&1 | tee reports/benchmark-build.log
          fi
          if [ -f reports/benchmark-source-commit.txt ]; then
            cp reports/benchmark-source-commit.txt reports/measured-commit.txt
            cp reports/benchmark-toolchain.txt reports/measured-toolchain.txt
          else
            git rev-parse HEAD > reports/measured-commit.txt
            rustc -Vv > reports/measured-toolchain.txt
          fi
          lscpu > reports/measured-cpu.txt
          sha256sum src/*.rs Cargo.lock examples/editor_benchmark.rs > reports/measured-source.sha256
          target/release/examples/editor_benchmark --diverse > reports/editor-ci-unfolded.json
          target/release/examples/editor_benchmark --diverse --folded > reports/editor-ci-folded.json
          /usr/bin/python3 scripts/check-editor-timings.py reports/editor-ci-unfolded.json reports/editor-ci-folded.json | tee reports/editor-ci-gates.log
      - name: Keep the exact CPU benchmark for harness-only verification
        if: always()
        run: |
          if [ -x target/release/examples/editor_benchmark ]; then
            if [ ! -f reports/benchmark-source-commit.txt ]; then
              git rev-parse HEAD > reports/benchmark-source-commit.txt
              rustc -Vv > reports/benchmark-toolchain.txt
            fi
            tar -czf reports/editor-benchmark-candidate.tar.gz -C target/release/examples editor_benchmark
            sha256sum target/release/examples/editor_benchmark > reports/editor-benchmark.sha256
          fi
      - name: Compare serial source editing and saving with Ferrite
        if: ${{ !cancelled() && (steps.build_candidate.outcome == 'success' || steps.restore_candidate.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ferrite-comparison"
          gh release download v0.3.0 --repo OlaProeis/Ferrite --pattern ferrite-linux-x64.tar.gz --dir "$RUNNER_TEMP/ferrite-comparison"
          printf '%s  %s\n' '338b201bf071728ddb08b7466008257e8e3e7325c717586cbfe5cc5edcc63ed8' "$RUNNER_TEMP/ferrite-comparison/ferrite-linux-x64.tar.gz" | sha256sum --check
          python3 - "$RUNNER_TEMP/ferrite-comparison" <<'PY'
          import sys, tarfile
          from pathlib import Path
          root = Path(sys.argv[1])
          with tarfile.open(root / 'ferrite-linux-x64.tar.gz') as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile() or member.isdir()
              archive.extractall(root / 'app', filter='data')
          binaries = [p for p in (root / 'app').rglob('ferrite') if p.is_file()]
          assert len(binaries) == 1
          (root / 'binary-path').write_text(str(binaries[0]))
          PY
          /usr/bin/python3 scripts/compare-editors.py --self-check
          extra=()
          if [ '${{ inputs.diagnostic_only }}' = 'true' ]; then extra+=(--trace-keys); fi
          /usr/bin/python3 scripts/compare-editors.py --ours target/release/rustidian --ours-source-commit "$(cat reports/binary-source-commit.txt)" --ferrite "$(cat "$RUNNER_TEMP/ferrite-comparison/binary-path")" "${extra[@]}" | tee reports/editor-comparison.log
      - name: Package the verified Linux application
        if: ${{ !inputs.diagnostic_only && success() }}
        run: |
          sha256sum target/release/rustidian > reports/release.sha256
          mv reports/rustidian-candidate-linux-x86_64.tar.gz reports/rustidian-linux-x86_64.tar.gz
          sha256sum reports/rustidian-linux-x86_64.tar.gz > reports/rustidian-linux-x86_64.tar.gz.sha256
          sha256sum reports/rustidian-linux-x86_64.tar.gz > reports/bundle.sha256
          df -h .
      - name: Keep the application and evidence for one day
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustidian-linux-${{ github.sha }}
          path: reports/
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn
