name: Store packages

on:
  workflow_dispatch:
  push:
    branches: ['work/store-launch-*']

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the snap
        run: |
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode --output rustidian_amd64.snap
          sha256sum rustidian_amd64.snap | tee rustidian_amd64.snap.sha256
      - name: Check the snap contents
        run: |
          unsquashfs -l rustidian_amd64.snap | tee snap-files.txt
          grep -q 'bin/rustidian' snap-files.txt
          grep -q 'THIRD_PARTY_NOTICES.txt' snap-files.txt
          grep -q 'share/doc/rustidian/copyright' snap-files.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustidian-snap
          path: |
            rustidian_amd64.snap
            rustidian_amd64.snap.sha256
          retention-days: 1
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev desktop-file-utils
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --release --locked
      - name: Build the AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL=$PWD/appimagetool python3 scripts/package-appimage.py --binary target/release/rustidian --notices THIRD_PARTY_NOTICES.txt --output Rustidian-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustidian-appimage
          path: |
            Rustidian-x86_64.AppImage
            Rustidian-x86_64.AppImage.sha256
          retention-days: 1
