name: Store packages

on:
  workflow_dispatch:
    inputs:
      appimage_only:
        description: Build and check the AppImage without building the snap
        type: boolean
        default: false
  push:
    branches: ['work/store-launch-*']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y --no-install-recommends desktop-file-utils appstream python3-yaml
      - run: python3 scripts/lint-packaging.py
  snap:
    if: ${{ !inputs.appimage_only }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the snap
        run: |
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode --output rustidian_amd64.snap
          sha256sum rustidian_amd64.snap | tee rustidian_amd64.snap.sha256
      - name: Check the snap contents
        run: |
          unsquashfs -l rustidian_amd64.snap | tee snap-files.txt
          grep -q 'bin/rustidian' snap-files.txt
          grep -q 'THIRD_PARTY_NOTICES.txt' snap-files.txt
          grep -q 'share/doc/rustidian/copyright' snap-files.txt
      - name: Install the snap and run it
        run: |
          sudo snap install --dangerous rustidian_amd64.snap
          snap run rustidian --version | tee snap-version.txt
          grep -q '^Rustidian ' snap-version.txt
          test -f /snap/rustidian/current/share/doc/rustidian/THIRD_PARTY_NOTICES.txt
          test -f /snap/rustidian/current/meta/gui/rustidian.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustidian-snap
          path: |
            rustidian_amd64.snap
            rustidian_amd64.snap.sha256
          retention-days: 1
  appimage:
    needs: lint
    # The catalog checks the oldest Ubuntu LTS still in standard support.
    # Packaging a newer release executable here cannot lower its glibc requirement.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dri desktop-file-utils xvfb xdotool xclip x11-utils x11-xserver-utils openbox zenity python3-pil
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - run: cargo +1.95.0 fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: appimage-ubuntu-22.04
      - run: cargo +1.95.0 build --release --locked
      - name: Check the executable's glibc requirement
        run: |
          set -o pipefail
          python3 - <<'PY' | tee appimage-glibc.txt
          import re, subprocess
          symbols = subprocess.check_output(['objdump', '-T', 'target/release/rustidian'], text=True)
          versions = {tuple(map(int, value.split('.'))) for value in re.findall(r'GLIBC_(\d+(?:\.\d+)+)', symbols)}
          assert versions, 'No glibc symbol requirements found'
          required = max(versions)
          print('Maximum required glibc:', '.'.join(map(str, required)))
          assert required <= (2, 35), f'Not compatible with Ubuntu 22.04: {required}'
          PY
      - name: Build the AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL=$PWD/appimagetool python3 scripts/package-appimage.py --binary target/release/rustidian --notices THIRD_PARTY_NOTICES.txt --output Rustidian-x86_64.AppImage
      - name: Run the AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./Rustidian-x86_64.AppImage --version | tee appimage-version.txt
          grep -q '^Rustidian ' appimage-version.txt
          APPIMAGE_EXTRACT_AND_RUN=1 ./Rustidian-x86_64.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/usr/share/doc/rustidian/THIRD_PARTY_NOTICES.txt
          test -f squashfs-root/usr/share/applications/io.github.masihmoafi.rustidian.desktop
      - name: Exercise the packaged app without network access
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p appimage-checks
          sudo --preserve-env=LIBGL_ALWAYS_SOFTWARE unshare --net -- runuser -u "$USER" -- \
            python3 tests/gui_smoke.py --binary "$PWD/squashfs-root/AppRun" \
            --section essential --report-dir "$PWD/appimage-checks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustidian-appimage
          path: |
            Rustidian-x86_64.AppImage
            Rustidian-x86_64.AppImage.sha256
            appimage-version.txt
            appimage-glibc.txt
            appimage-checks/
          retention-days: 1
