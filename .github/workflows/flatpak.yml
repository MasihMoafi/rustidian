name: Flatpak check

# Generates the offline cargo sources, builds the Flathub manifest from source with Flathub's tooling, lints it, and
# uploads cargo-sources.json (Flathub needs it beside the manifest) and the bundle.
on:
  push:
    branches: [build/flatpak]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Offline cargo sources
        run: |
          dnf install -y python3-aiohttp python3-tomlkit python3-pip || pip install aiohttp tomlkit
          curl -sSLo /tmp/gen.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/gen.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: rustidian.flatpak
          manifest-path: packaging/flatpak/io.github.masihmoafi.rustidian.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Flathub linter (manifest)
        run: |
          flatpak install -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.masihmoafi.rustidian.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cargo-sources
          path: packaging/flatpak/cargo-sources.json
